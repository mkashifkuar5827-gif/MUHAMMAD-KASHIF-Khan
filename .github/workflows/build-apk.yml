name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Correct Package Name setup for Google Services
      - name: Setup Build Dependencies
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          
          echo '{"project_info":{"project_number":"123456789","project_id":"dummy-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.aistudio.kashifmobile.shop"}},"api_key":[{"current_key":"dummy_key"}]}]}' > app/google-services.json

      # Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # Upload final APK for download
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kashif-Mobile-Repair-APK
          path: app/build/outputs/apk/debug/app-debug.apk
