name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 1. Duplicate icons clean karein
      - name: Auto Clean Duplicate Resources
        run: |
          find app/src/main/res/ -type f \( -name "ic_launcher*.webp" -o -name "ic_launcher*.png" \) -delete || true

      # 2. Missing Keystore aur Google Services files auto-generate karein
      - name: Generate Missing Keystore & Google Services
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore || true
          
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"dummy-app"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.kashif.mobilerepair"}},"api_key":[{"current_key":"dummy_key"}]}]}' > app/google-services.json
          fi

      # 3. Build Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug

      # 4. Upload finished APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kashif-Mobile-Repair-APK
          path: app/build/outputs/apk/debug/app-debug.apk
