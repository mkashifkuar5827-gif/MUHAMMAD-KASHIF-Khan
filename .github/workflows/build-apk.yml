name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Duplicate resources cleanup
      - name: Auto Clean Duplicate Resources
        run: |
          find app/src/main/res/ -type f \( -name "ic_launcher*.webp" -o -name "ic_launcher*.png" \) -delete || true

      # Direct Gradle Build (Gradlew file ki zarurat nahi pare gi)
      - name: Build Debug APK
        run: gradle assembleDebug

      # Upload final APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Kashif-Mobile-Repair-APK
          path: app/build/outputs/apk/debug/app-debug.apk
