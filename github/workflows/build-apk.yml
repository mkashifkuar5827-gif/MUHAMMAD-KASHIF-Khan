name: Build KASHIF MOBILE AND REPAIR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download project
      - name: Checkout project
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 5. Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1'

      # 6. Check project
      - name: Check project files
        run: |
          echo "===== PROJECT FILES ====="
          ls -la
          echo "===== APP DIRECTORY ====="
          ls -la app || true
          echo "===== GRADLE FILES ====="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      # 7. Create temporary debug keystore
      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 8. Build Debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      # 9. Show generated APK
      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find app/build/outputs/apk -type f -name "*.apk" -print

      # 10. Rename APK
      - name: Prepare APK
        run: |
          mkdir -p release-apk
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            exit 1
          fi
          cp "$APK" "release-apk/KASHIF-MOBILE-AND-REPAIR.apk"
          ls -lh release-apk/

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KASHIF-MOBILE-AND-REPAIR
          path: release-apk/KASHIF-MOBILE-AND-REPAIR.apk
          if-no-files-found: error
